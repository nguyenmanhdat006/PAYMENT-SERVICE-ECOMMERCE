spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: payment-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:nguyendat}
    password: ${DB_PASSWORD:nguyendat}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api}

# Payment Service Configuration
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:DEMO}
  hash-secret: ${VNPAY_HASH_SECRET:DEMOHASHSECRET}
  url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8085/api/payments/vnpay/callback}
  version: ${VNPAY_VERSION:2.1.0}
  command: ${VNPAY_COMMAND:pay}

order-service:
  url: ${ORDER_SERVICE_URL:http://localhost:8084}

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

logging:
  level:
    com.ecommerce: ${LOGGING_LEVEL_COM_ECOMMERCE:DEBUG}
    org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:INFO}
    org.hibernate: ${LOGGING_LEVEL_ORG_HIBERNATE:WARN}
